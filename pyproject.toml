[build-system]
# Версии hatchling >=1.24 пишут в METADATA поля License-File (PEP 639); `twine check`
# до полной поддержки может ругаться — сборка и установка wheel при этом корректны.
requires = ["hatchling>=1.21.0,<1.24"]
build-backend = "hatchling.build"

[project]
name = "neuro-geometry"
version = "0.2.0"
description = "2D geometric primitives (Point, Line, Quadrangle, Rectangle, Triangle) for vision pipelines"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Oleg Migutin" }]
keywords = ["geometry", "computer-vision", "2d"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.23",
]

[project.optional-dependencies]
# Нужен только для Rectangle(rotated=True). Если в проекте уже стоит opencv-python
# (или contrib), extra ставить не нужно: два дистрибутива OpenCV конфликтуют.
cv = [
  "opencv-python-headless>=4.5.1",
]
dev = [
  "opencv-python-headless>=4.5.1",
  "pytest>=7.4",
  "ruff>=0.5",
  "mypy>=1.10",
  "build>=1.0.0",
  "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/omigutin/neuro_geometry"
Repository = "https://github.com/omigutin/neuro_geometry"
Changelog = "https://github.com/omigutin/neuro_geometry/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/omigutin/neuro_geometry/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/neuro_geometry"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/NOTICE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Кириллица и типографские знаки в докстрингах и комментариях — норма для проекта
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["cv2"]
ignore_missing_imports = true
